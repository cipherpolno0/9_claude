# กู้คืนไฟล์สำรองลงโครงการชุดทดสอบที่ว่าง (บทที่ 32) ใช้ทั้งซ้อมกู้คืนและตั้งชุดทดสอบครั้งแรก
# ไม่มีทางกู้ทับชุดใช้งานจริง: ปลายทางมาจาก Secret ของชุดทดสอบเท่านั้น และสคริปต์หยุดถ้าปลายทางมีตารางอยู่แล้ว
# Secrets ที่ต้องมี: STAGING_DB_URL, STAGING_SUPABASE_URL, STAGING_SUPABASE_SECRET_KEY, BACKUP_PASSPHRASE
# (ไม่บังคับ) SUPABASE_ACCESS_TOKEN + PROD_PROJECT_REF + STAGING_PROJECT_REF: คัดลอกกุญแจหลักของ Vault
#   เพื่อให้ชุดทดสอบถอดกุญแจ national_id_key ได้ (ไม่ตั้ง = ข้อมูลอื่นกู้ได้ แต่ฟังก์ชันเข้ารหัสเลขประจำตัวใช้ไม่ได้)
name: กู้คืนลงชุดทดสอบ

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "เลขที่การรันสำรองข้อมูล (เว้นว่าง = ครั้งล่าสุดที่สำเร็จ)"
        required: false
      confirm:
        description: 'พิมพ์ RESTORE-STAGING เพื่อยืนยัน'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  restore:
    if: ${{ inputs.confirm == 'RESTORE-STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_DB_URL: ${{ secrets.STAGING_DB_URL }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: ติดตั้งเครื่องมือ
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client
          npm ci --ignore-scripts
      - name: หาไฟล์สำรอง
        run: |
          id="${{ inputs.backup_run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list --workflow backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$id" ] || { echo "ไม่พบการสำรองข้อมูลที่สำเร็จ"; exit 1; }
          echo "RUN_ID=$id" >> "$GITHUB_ENV"
          echo "ใช้ไฟล์สำรองจากการรันเลขที่ $id"
      - uses: actions/download-artifact@v4
        with:
          name: backup
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: encrypted
      - name: ถอดรหัส
        run: |
          mkdir -p backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -d encrypted/*.gpg | tar -C backup -xzf -
          cat backup/db/created-at.txt
      - name: คัดลอกกุญแจหลักของ Vault (ถ้าตั้งไว้)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROD_PROJECT_REF" ] || [ -z "$STAGING_PROJECT_REF" ]; then
            echo "ข้าม: ไม่ได้ตั้ง Secret สำหรับคัดลอกกุญแจหลัก"; exit 0
          fi
          curl -fsS "https://api.supabase.com/v1/projects/$PROD_PROJECT_REF/pgsodium" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" |
            curl -fsS "https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF/pgsodium" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -X PUT --json @- > /dev/null
          echo "คัดลอกกุญแจหลักแล้ว"
      - name: กู้คืนฐานข้อมูลและเทียบจำนวนแถว
        run: bash scripts/ops/restore-db.sh backup/db
      - name: กู้คืนไฟล์
        run: node scripts/ops/storage-files.mjs restore backup/storage
      - name: ลบไฟล์ที่ถอดรหัสแล้ว
        if: always()
        run: rm -rf backup encrypted
